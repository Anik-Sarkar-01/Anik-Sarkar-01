name: Generate Stats Images

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout github-stats source
        uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          ref: master
          path: github-stats-src

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build github-stats
        working-directory: github-stats-src
        run: zig build

      - name: Generate images
        run: |
          mkdir -p generated
          ./github-stats-src/zig-out/bin/github-stats \
            --overview-output-file generated/overview.svg \
            --languages-output-file generated/languages.svg
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_PRIVATE: "false"
          SILENT: "true"
          MAX_RETRIES: 5

      - name: Commit and push generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "Update generated stats images" || echo "No changes to commit"
          git push
